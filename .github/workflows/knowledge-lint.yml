name: knowledge-lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the linter
        run: python3 -m unittest tests.test_lint_knowledge
      - name: Lint knowledge files
        run: python3 scripts/lint_knowledge.py --strict
