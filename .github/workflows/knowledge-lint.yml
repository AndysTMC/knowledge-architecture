name: knowledge-lint

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  lint:
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test the linter
        run: python3 -m unittest tests.test_lint_knowledge
      - name: Lint knowledge files
        run: python3 scripts/lint_knowledge.py --strict

  promotion:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Block ungated promotions and protected deletions
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          ALLOW_PROMO: ${{ contains(github.event.pull_request.labels.*.name, 'human-accepted') }}
          ALLOW_EDIT: ${{ contains(github.event.pull_request.labels.*.name, 'human-edited') }}
          ALLOW_DEL: ${{ contains(github.event.pull_request.labels.*.name, 'human-removed') }}
        run: |
          git show "$BASE:scripts/lint_knowledge.py" > "$RUNNER_TEMP/knowledge-gate-base.py"
          for checker in "$RUNNER_TEMP/knowledge-gate-base.py" scripts/lint_knowledge.py; do
            extra=()
            if [ "$ALLOW_PROMO" = "true" ]; then
              extra+=(--allow-promotion)
            fi
            if [ "$ALLOW_DEL" = "true" ]; then
              extra+=(--allow-deletion)
            fi
            checker_help=$(python3 "$checker" --help)
            if [[ "$ALLOW_EDIT" = "true" && "$checker_help" == *"--allow-edit"* ]]; then
              extra+=(--allow-edit)
            fi
            python3 "$checker" --root "$GITHUB_WORKSPACE" --promotion-base "$BASE" --format json "${extra[@]}"
          done
